name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck -x -s bash main.sh lib/*.sh lib/host/*.sh lib/apps/*.sh bin/* templates/react/deploy-app
