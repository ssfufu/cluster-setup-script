# Managed by cluster-setup — catch-all for unknown host names
server {
    listen 80 default_server;
    {{LISTEN6_80}}
    server_name _;

    include snippets/cluster-acme.conf;

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    {{LISTEN6_443}}
    server_name _;
    ssl_reject_handshake on;
}
