# Managed by cluster-setup — global settings (http context)
server_tokens off;
client_max_body_size 1G;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Metrics for the Prometheus nginx exporter (local only)
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
    location / {
        return 404;
    }
}
