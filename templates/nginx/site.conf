# Managed by cluster-setup — site "{{NAME}}"
# Access mode lives in snippets/cluster-access-{{NAME}}.conf
# (change it with: ./main.sh site open|restrict {{NAME}})
server {
    listen 80;
    {{LISTEN6_80}}
    server_name {{FQDN}};

    include snippets/cluster-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl{{HTTP2_LISTEN}};
    {{LISTEN6_443}}
    {{HTTP2_DIRECTIVE}}
    server_name {{FQDN}};

    ssl_certificate     /etc/letsencrypt/live/{{FQDN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{FQDN}}/privkey.pem;
    include snippets/cluster-ssl.conf;

    location / {
        include snippets/cluster-access-{{NAME}}.conf;
        proxy_pass {{UPSTREAM}};
        include snippets/cluster-proxy.conf;
    }
}
