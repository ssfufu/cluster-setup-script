# Managed by cluster-setup
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['{{GATEWAY}}:9100']
        labels:
          instance: host

  - job_name: nginx
    static_configs:
      - targets: ['{{GATEWAY}}:9113']
        labels:
          instance: host

  - job_name: cadvisor
    static_configs:
      - targets: ['{{GATEWAY}}:8899']
        labels:
          instance: host
