# Managed by cluster-setup — regenerated by ./main.sh setup
# Files in sshd_config.d are read first, so these values take precedence.
Port {{SSH_PORT}}
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication {{PASSWORD_AUTH}}
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AllowGroups sshusers
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
