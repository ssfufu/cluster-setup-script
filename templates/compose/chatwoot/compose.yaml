# Managed by cluster-setup — based on Chatwoot's production compose file.
x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:${CHATWOOT_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./storage:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  rails:
    <<: *chatwoot
    ports:
      - "127.0.0.1:${HOST_PORT}:3000"
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  sidekiq:
    <<: *chatwoot
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    # $$ : expanded inside the container, so the password is not stored in
    # the container definition.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - ./redis:/data
