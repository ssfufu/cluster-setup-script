# Managed by cluster-setup
services:
  appsmith:
    image: index.docker.io/appsmith/appsmith-ce:${APPSMITH_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT}:80"
    environment:
      APPSMITH_DISABLE_TELEMETRY: "true"
    volumes:
      - ./stacks:/appsmith-stacks
