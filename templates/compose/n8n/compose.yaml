# Managed by cluster-setup
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT}:5678"
    environment:
      N8N_HOST: ${FQDN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      N8N_EDITOR_BASE_URL: https://${FQDN}/
      WEBHOOK_URL: https://${FQDN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      NODE_ENV: production
    volumes:
      - ./data:/home/node/.n8n
    security_opt:
      - no-new-privileges:true
